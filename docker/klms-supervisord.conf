; supervisord config for the klms container.
;
; Replaces the old hand-rolled entrypoint (two background processes + a curl
; probing watchdog). A real process supervisor gives us:
;   - autorestart on crash for BOTH tiers (a dead web tier no longer masks as
;     healthy — the exact problem the watchdog was a band-aid for),
#   - exactly ONE messenger worker (supervisord runs a single program instance;
#     it only restarts after the process exits),
#   - per-process logging.
;
; The worker's --time-limit=3600 makes it exit after an hour; autorestart=true
; then brings a fresh worker up — the periodic-restart behaviour we want.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
pidfile=/var/run/supervisord.pid

; --- web tier: PHP built-in server (single-threaded, fine for a LAN party) ---
[program:web]
command=php -S 0.0.0.0:8094 -t /app/public /app/docker/klms-router.php
directory=/app
user=root
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --- messenger worker: the container's long-lived background job ---
[program:worker]
command=php bin/console messenger:consume async --time-limit=3600
directory=/app
user=root
autostart=true
autorestart=true
startsecs=3
startretries=10
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
